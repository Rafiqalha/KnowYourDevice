name: Build Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Build and test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\package.ps1
      - name: Publish versioned EXE and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          gh release create "v$version" "dist/KnowYourDevice-$version-Windows-x64.exe" "dist/SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "KnowYourDevice $version" --notes-file "docs/releases/v$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
